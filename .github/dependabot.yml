# Keeps pinned actions and hash-pinned tool requirements current. Each update is
# a pull request, so CI, the self-check and review still apply.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # The repository's own Action is pinned to a reviewed commit by hand.
      - dependency-name: adi271213/remit
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      tools:
        patterns: ["*"]
    ignore:
      # PyYAML is vendored and checked against vendor/pyyaml/manifest.json. Refresh it
      # with scripts/vendor_pyyaml.py (see vendor/README.md), which also updates
      # requirements.txt, rather than a version bump here.
      - dependency-name: pyyaml
