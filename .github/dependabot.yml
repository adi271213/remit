# Keeps the pinned GitHub Actions current. Each update is a pull request, so CI,
# the self-check and review still apply.
#
# The hash-pinned Python requirements are updated by hand: Dependabot bumped the
# version in requirements-lint.txt but kept the old hash, which pip then rightly
# refused. To update one, download the wheel, check its SHA-256 against PyPI, and
# change the version and hash together (see CONTRIBUTING.md).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # The repository's own Action is pinned to a reviewed commit by hand.
      - dependency-name: adi271213/remit
