# Coverage-guided fuzzing of compare() and audit() with Atheris (fuzz/fuzz_remit.py).
name: Fuzz
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '37 3 * * 4'
permissions:
  contents: read
concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fuzz:
    name: Fuzz compare and audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install hash-verified dependencies
        run: |
          python -I -m pip --isolated install --disable-pip-version-check --only-binary=:all: -r requirements.txt
          python -I -m pip --isolated install --disable-pip-version-check --only-binary=:all: -r requirements-fuzz.txt
      - name: Fuzz for five minutes
        run: |
          mkdir -p "$RUNNER_TEMP/corpus"
          python fuzz/fuzz_remit.py -max_total_time=300 -rss_limit_mb=4096 \
            -artifact_prefix="$RUNNER_TEMP/" "$RUNNER_TEMP/corpus" fuzz/corpus
      - name: Keep a failing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crash
          path: ${{ runner.temp }}/crash-*
          if-no-files-found: ignore
