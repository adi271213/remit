# Publishes the CLI package to PyPI. Run it by hand from the Actions tab, on main.
# One-time setup: add this repository as a trusted publisher for the
# remit-actions project on PyPI (workflow: publish.yml, environment: pypi).
# PyPI never accepts the same version twice, so a repeated run cannot replace a release.
name: Publish to PyPI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Check this is main
        env:
          REF: ${{ github.ref }}
        run: |
          if [[ "$REF" != "refs/heads/main" ]]; then
            echo "::error::Publish from main, not $REF."
            exit 1
          fi
      - name: Install hash-verified build tools
        run: python -I -m pip --isolated install --disable-pip-version-check -r requirements-release.txt
      - name: Build sdist and wheel
        run: python -m build --no-isolation
      - name: Test the built wheel
        run: |
          python -I -m pip --isolated install --disable-pip-version-check --only-binary=:all: -r requirements.txt
          python -I -m pip --isolated install --disable-pip-version-check --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          remit scan --dirs "$GITHUB_WORKSPACE/examples/base" "$GITHUB_WORKSPACE/examples/head" --format json > report.json
          python -c 'import json; r = json.load(open("report.json")); assert r["analysis"] == "complete" and r["findings"], r'
      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: pypi
      url: https://pypi.org/p/remit-actions
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
