# Publishes the CLI package to PyPI when a GitHub release is published.
# One-time setup: add this repository as a trusted publisher for the
# workflow-privilege-check project on PyPI (workflow: publish.yml, environment: pypi).
name: Publish to PyPI
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Check the tag matches the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [[ "$TAG" != "v$version" ]]; then
            echo "::error::Release tag $TAG does not match package version $version."
            exit 1
          fi
      - name: Install hash-verified build tools
        run: python -I -m pip --isolated install --disable-pip-version-check -r requirements-release.txt
      - name: Build sdist and wheel
        run: python -m build --no-isolation
      - name: Test the built wheel
        run: |
          python -I -m pip --isolated install --disable-pip-version-check --only-binary=:all: -r requirements.txt
          python -I -m pip --isolated install --disable-pip-version-check --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          workflow-privilege-check scan --dirs "$GITHUB_WORKSPACE/examples/base" "$GITHUB_WORKSPACE/examples/head" --format json > report.json
          python -c 'import json; r = json.load(open("report.json")); assert r["analysis"] == "complete" and r["findings"], r'
      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: pypi
      url: https://pypi.org/p/workflow-privilege-check
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
