[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "remit-actions"
version = "1.2"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
description = "See what a pull request changes about what your GitHub Actions workflows are allowed to do."
requires-python = ">=3.11"
keywords = ["github-actions", "security", "ci", "workflows", "permissions", "supply-chain", "code-review"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["PyYAML==6.0.3"]

[project.urls]
Source = "https://github.com/adi271213/remit"
Issues = "https://github.com/adi271213/remit/issues"
Documentation = "https://github.com/adi271213/remit/blob/main/SETUP.md"

[project.scripts]
remit = "remit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
# E402: scripts and tests put src/ on sys.path before importing the package.
# B905: zipped sequences have equal length by construction.
ignore = ["E402", "B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
