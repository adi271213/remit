[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "workflow-privilege-check"
version = "0.1.0"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
description = "Explain supported GitHub Actions privilege changes between two snapshots."
requires-python = ">=3.11"
dependencies = ["PyYAML==6.0.3"]

[project.urls]
Source = "https://github.com/adi271213/workflow-privilege-check"
Issues = "https://github.com/adi271213/workflow-privilege-check/issues"
Documentation = "https://github.com/adi271213/workflow-privilege-check/blob/main/SETUP.md"

[project.scripts]
workflow-privilege-check = "privilege_check.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
# E402: scripts and tests put src/ on sys.path before importing the package.
# B905: zipped sequences have equal length by construction.
ignore = ["E402", "B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
